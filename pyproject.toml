[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-monitor"
version = "0.1.0"
description = "Track AI provider quotas and balances through their official APIs, forecast exhaustion, render a static report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ai-usage-monitor = "ai_usage_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["ai_usage_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
